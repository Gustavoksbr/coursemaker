name: CI

# Roda os testes de cada parte do projeto a cada push na main e em todo pull request.
# Cada parte e um job separado: se uma quebra, as outras continuam e o log mostra qual foi.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execucao anterior da mesma branch, em vez de empilhar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Os testes de integracao sobem um PostgreSQL de verdade embutido (Zonky): nao precisa de Docker nem de servico.
      - name: Testes
        run: mvn -B -ntp test

  frontend:
    name: Frontend (Vitest e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Build de producao
        run: npm run build

  gateway:
    name: Gateway do executor de codigo (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: piston-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: piston-gateway/go.mod
          cache-dependency-path: piston-gateway/go.mod
      - name: Verificacao estatica
        run: go vet ./...
      - name: Testes
        run: go test ./...

  seo-functions:
    name: Funcoes da Vercel (previews e sitemap)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes
        run: node --test api/_lib/seo.test.js
