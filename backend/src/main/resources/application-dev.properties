# Activated with SPRING_PROFILES_ACTIVE=dev (see .vscode/terminals.json "Backend Dev (DB local)").
# Points the datasource at the fixed local database from .env (DATABASE_URL_DEV) instead of
# whatever DATABASE_URL is set to (which normally points at production/Supabase), so local runs
# and seeding scripts never touch real prod data. Everything else (JWT, CORS, Cloudinary...) is
# shared.
spring.datasource.url=${DATABASE_URL_DEV}
