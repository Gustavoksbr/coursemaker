# Activated with SPRING_PROFILES_ACTIVE=e2e (see .vscode/terminals.json "Backend E2E"). Points the
# datasource at the secondary database from .env (DATABASE_URL_TESTES) instead of the dev one, so
# Playwright runs never touch real dev data. Everything else (JWT, CORS, Cloudinary...) is shared.
spring.datasource.url=${DATABASE_URL_TESTES}
