spring.application.name=coursemaker

# ---------------------------------------------------------------------------
# .env loading
# ---------------------------------------------------------------------------
# The .env file uses plain KEY=VALUE syntax, which is also valid .properties
# syntax, so Spring Boot can import it natively (no extra dependency needed).
# Values are optional: every placeholder below has a sane fallback.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=always

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
# User and password travel embedded in the URL itself (?user=...&password=...) instead of as
# separate properties, so each environment only needs to set one variable.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/coursemaker?user=postgres&password=postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate  (schema is owned by Flyway; Hibernate only validates)
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-me-use-openssl-rand-hex-64-to-generate-a-secure-secret}
jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}
jwt.issuer=${JWT_ISSUER:coursemaker-api}

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ---------------------------------------------------------------------------
# Public site URL - the canonical frontend origin, printed on certificates as the content's link.
# Not the same as FRONTEND_URL (a comma-separated CORS allow-list) or app.production-url (this
# API's own address for self-ping): this one is always the real public site, even when the
# backend generating the certificate is running locally against a test database.
# ---------------------------------------------------------------------------
app.public-url=${PUBLIC_APP_URL:https://coursemakerbr.vercel.app}

# ---------------------------------------------------------------------------
# Fixed admin account (optional - synced on every boot when both are set; see AdminAccountSeeder)
# ---------------------------------------------------------------------------
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
# Anti-spam window: the same actor cannot re-trigger the same notification (same recipient, type,
# and target entity) more than once within this many hours.
app.notifications.dedup-window-hours=${NOTIFICATIONS_DEDUP_WINDOW_HOURS:24}

# ---------------------------------------------------------------------------
# Google OAuth2 (optional - leave GOOGLE_CLIENT_ID empty to disable)
# ---------------------------------------------------------------------------
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.tokeninfo-url=https://oauth2.googleapis.com/tokeninfo

# ---------------------------------------------------------------------------
# Resend (optional - leave RESEND_API_KEY empty to disable password-reset emails)
# ---------------------------------------------------------------------------
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_EMAIL_FROM:}
resend.api-url=https://api.resend.com/emails

# ---------------------------------------------------------------------------
# Password reset
# ---------------------------------------------------------------------------
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:60}

# ---------------------------------------------------------------------------
# Cloudinary (optional - leave CLOUDINARY_CLOUD_NAME empty to disable image
# uploads; image blocks still accept a pasted URL either way)
# ---------------------------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:coursemaker}

# ---------------------------------------------------------------------------
# Groq AI (optional - leave GROQ_API_KEY empty to disable the dashboard assistant)
# ---------------------------------------------------------------------------
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.api-url=https://api.groq.com/openai/v1/chat/completions

# ---------------------------------------------------------------------------
# Self-ping (optional - leave API_PRODUCTION_URL empty to disable; keeps the
# Render instance and the Supabase database from going idle)
# ---------------------------------------------------------------------------
app.production-url=${API_PRODUCTION_URL:}

# ---------------------------------------------------------------------------
# Code runner (piston-gateway, in /piston-gateway) - executes the code blocks.
# The gateway is the only thing exposed; Piston itself has no auth and stays on the
# gateway's internal Docker network. Leave CODE_RUNNER_TOKEN empty to disable.
# ---------------------------------------------------------------------------
code-runner.url=${CODE_RUNNER_URL:http://localhost:8081}
code-runner.token=${CODE_RUNNER_TOKEN:}
# Loga entrada/esperado/obtido de cada teste (inclusive dos escondidos). Ligado so no perfil dev.
code-runner.log-details=${CODE_RUNNER_LOG_DETAILS:false}

# ---------------------------------------------------------------------------
# --- RATE LIMIT -------------------------------------------------------------
# Everything throttle-related lives here (brute force, mail-bombing). Generous on purpose: people
# may mistype a lot and a block only lasts a short while. Override via the env var in each placeholder.
# ---------------------------------------------------------------------------

# --- Login -----------------------------------------------------------------
# At most MAX_ATTEMPTS failures per (IP + email/nickname) within WINDOW_SECONDS; past that the pair
# is blocked for BLOCK_SECONDS. IP_MAX_ATTEMPTS caps failures from one IP across ALL accounts.
# Never keyed by the account alone, so nobody can lock another person out by spamming their email.
app.login-rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:20}
app.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
app.login-rate-limit.block-seconds=${LOGIN_RATE_LIMIT_BLOCK_SECONDS:30}
app.login-rate-limit.ip-max-attempts=${LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS:100}

# --- Sign-up (POST /auth/register) -------------------------------------------------------------
# Every sign-up request from one IP counts; past MAX_ATTEMPTS within WINDOW_SECONDS that IP is blocked
# for BLOCK_SECONDS. Stops scripts from mass-creating accounts or burning CPU on password hashing.
app.register-rate-limit.max-attempts=${REGISTER_RATE_LIMIT_MAX_ATTEMPTS:20}
app.register-rate-limit.window-seconds=${REGISTER_RATE_LIMIT_WINDOW_SECONDS:600}
app.register-rate-limit.block-seconds=${REGISTER_RATE_LIMIT_BLOCK_SECONDS:60}

# --- Private content passwords (private courses, private posts, password-reset token) -----------
# N consecutive wrong tries per user+content block it for BLOCK_MINUTES; a success clears the counter.
app.private-content-rate-limit.max-attempts=${PRIVATE_CONTENT_RATE_LIMIT_MAX_ATTEMPTS:20}
app.private-content-rate-limit.block-minutes=${PRIVATE_CONTENT_RATE_LIMIT_BLOCK_MINUTES:1}

# --- Password-reset EMAILS (anti mail-bombing) -------------------------------------------------
# Every request counts, registered email or not, so the 429 does not reveal which emails exist.
#  max-per-client: per (IP + email) - what one person can ask for the same inbox within the window;
#  ip-max:         per IP, across all inboxes;
#  max-per-email:  total per inbox from anyone (distributed backstop; keep it generous, since the
#                  real owner shares this bucket with whoever is flooding them).
app.password-reset.rate-limit.max-per-client=${PASSWORD_RESET_RATE_LIMIT_MAX_PER_CLIENT:10}
app.password-reset.rate-limit.ip-max=${PASSWORD_RESET_RATE_LIMIT_IP_MAX:40}
app.password-reset.rate-limit.max-per-email=${PASSWORD_RESET_RATE_LIMIT_MAX_PER_EMAIL:30}
app.password-reset.rate-limit.window-seconds=${PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS:3600}
app.password-reset.rate-limit.block-seconds=${PASSWORD_RESET_RATE_LIMIT_BLOCK_SECONDS:300}
# Minimum wait between two reset emails to the same account.
app.password-reset.resend-cooldown-seconds=${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:60}

# --- Client IP ---------------------------------------------------------------------------------
# Behind Render's proxy the real client IP comes in X-Forwarded-For; without this every user would
# share the proxy's IP and the per-IP limits would hit everybody. Set FORWARD_HEADERS_STRATEGY=none
# when the API is exposed directly (no proxy), otherwise clients could spoof the header.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Header(s), in order, that carry the REAL client IP when a CDN sits in front (Render is behind
# Cloudflare: set CLIENT_IP_HEADERS=CF-Connecting-IP there). Only list headers your CDN sets itself -
# a header a client could forge would let it dodge every limit above. Empty = use the socket address.
app.client-ip.headers=${CLIENT_IP_HEADERS:}
