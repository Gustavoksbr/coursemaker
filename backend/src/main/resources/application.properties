spring.application.name=coursemaker

# ---------------------------------------------------------------------------
# .env loading
# ---------------------------------------------------------------------------
# The .env file uses plain KEY=VALUE syntax, which is also valid .properties
# syntax, so Spring Boot can import it natively (no extra dependency needed).
# Values are optional: every placeholder below has a sane fallback.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=always

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/coursemaker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate  (schema is owned by Flyway; Hibernate only validates)
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-me-use-openssl-rand-hex-64-to-generate-a-secure-secret}
jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}
jwt.issuer=${JWT_ISSUER:coursemaker-api}

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ---------------------------------------------------------------------------
# Brute-force protection
# ---------------------------------------------------------------------------
app.rate-limit.max-attempts=5
app.rate-limit.block-minutes=15

# ---------------------------------------------------------------------------
# Google OAuth2 (optional - leave GOOGLE_CLIENT_ID empty to disable)
# ---------------------------------------------------------------------------
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.tokeninfo-url=https://oauth2.googleapis.com/tokeninfo

# ---------------------------------------------------------------------------
# Cloudinary (optional - leave CLOUDINARY_CLOUD_NAME empty to disable image
# uploads; image blocks still accept a pasted URL either way)
# ---------------------------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:coursemaker}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.coursemaker=INFO
